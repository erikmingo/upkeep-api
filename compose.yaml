services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: upkeep
      POSTGRES_PASSWORD: upkeep
      POSTGRES_DB: upkeep
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upkeep"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
